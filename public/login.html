<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#fbeef0" />
  <title>Entra</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css?v=6" />
</head>
<body class="login-body">
  <main class="gate">
    <div class="gate-heart" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-6.7-4.35-9.33-8.5C1.2 10 2 6.6 5 5.3c2-.86 4.2-.16 5.4 1.5L12 8.3l1.6-1.5c1.2-1.66 3.4-2.36 5.4-1.5 3 1.3 3.8 4.7 2.33 7.2C18.7 16.65 12 21 12 21z"/></svg></div>
    <h1 class="gate-title" id="coupleName">Noi due</h1>
    <p class="gate-sub">Il nostro angolo. Entra con la parola segreta.</p>
    <form id="loginForm" class="gate-form" autocomplete="off">
      <input id="password" type="password" name="password" placeholder="parola segreta" aria-label="Password" required />
      <button type="submit">Entra</button>
    </form>
    <p id="error" class="gate-error" role="alert"></p>
  </main>

  <script>
    fetch('/api/config').then(r => r.json()).then(c => {
      if (c.coupleName) document.getElementById('coupleName').textContent = c.coupleName;
    }).catch(() => {});

    const form = document.getElementById('loginForm');
    const errEl = document.getElementById('error');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errEl.textContent = '';
      const password = document.getElementById('password').value;
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password }),
      });
      if (res.ok) {
        window.location.href = '/';
      } else {
        const d = await res.json().catch(() => ({}));
        errEl.textContent = d.error || 'Non ha funzionato, riprova.';
        form.classList.remove('shake'); void form.offsetWidth; form.classList.add('shake');
      }
    });
  </script>
</body>
</html>
